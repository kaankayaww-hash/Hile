<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zile Gece Korkusu 🌙</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 10;
        }
        #message {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h3>Zile Sokakları 🏚️</h3>
        <p>Yön Tuşları / WASD: Hareket Et</p>
        <p>Fare: Etrafa Bak</p>
        <p>Görev: Eski Konağın Anahtarını Bul! 🔑</p>
    </div>

    <div id="crosshair"></div>
    <div id="message">Sis basıyor... Dikkatli ol, Pistachio! 🌫️</div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Sahne, Kamera ve Renderer Kurulumu
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x050510, 0.08);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Işıklandırma (Karanlık ve Korku Atmosferi)
        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffee, 3, 25, Math.PI / 6, 0.5, 2);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -5);
        camera.add(flashlight);
        camera.add(flashlight.target);
        scene.add(camera);

        // Zemin (Kaldırım)
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Eski Zile Konakları (Basit Duvarlar ve Binalar)
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x2b2521, roughness: 0.8 });
        for (let i = -30; i <= 30; i += 10) {
            if (i === 0) continue;
            const bGeo = new THREE.BoxGeometry(6, 12, 6);
            const building = new THREE.Mesh(bGeo, buildingMat);
            building.position.set(i, 6, -15);
            scene.add(building);

            const buildingOpposite = building.clone();
            buildingOpposite.position.set(i, 6, 15);
            scene.add(buildingOpposite);
        }

        // Kontroller ve Hareket Değişkenleri
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
            }
        });

        // Fare ile Bakış (Pointer Lock)
        document.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                const movementX = e.movementX || e.mozMovementX || 0;
                const movementY = e.movementY || e.mozMovementY || 0;
                camera.rotation.y -= movementX * 0.002;
            }
        });

        // Animasyon ve Oyun Döngüsü
        let prevTime = performance.now();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x = 0;
            velocity.z = 0;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 5.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 5.0 * delta;

            camera.translateX(velocity.x);
            camera.translateZ(velocity.z);

            // Kamerayı sınırda tut
            camera.position.x = Math.max(-4, Math.min(4, camera.position.x));

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // Pencere Boyutu Ayarı
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
